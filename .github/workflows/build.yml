name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Restore fixed debug keystore
      env:
        KS_B64: ${{ secrets.XVJ_DEBUG_KEYSTORE }}
      run: |
        if [ -z "$KS_B64" ]; then
          echo "::warning::未配置 secret XVJ_DEBUG_KEYSTORE，本次将用 runner 随机 debug keystore 签名（设备无法覆盖安装/OTA）"
          exit 0
        fi
        mkdir -p "$HOME/.android"
        printf '%s' "$KS_B64" | base64 -d > /tmp/seed.p12
        # openssl 生成的 p12 会被 AGP 判为不适用并静默重生成随机钥匙，必须用 runner 自己的
        # JDK keytool 重新封装成 JDK 原生 p12 再落位
        keytool -importkeystore \
          -srckeystore /tmp/seed.p12 -srcstoretype PKCS12 -srcstorepass android \
          -destkeystore "$HOME/.android/debug.keystore" -deststoretype PKCS12 \
          -deststorepass android -destkeypass android -noprompt
        rm -f /tmp/seed.p12
        echo "=== 最终 debug.keystore（证书 SHA-256 必须是 D2:B0:8C:51:A0:BC:CA:1F:2B:C2:9F:20:FD:8F:F5:F3:92:77:25:A9:CE:3D:83:55:B7:70:EF:03:C5:C9:60:DF）==="
        keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

    - name: Build with Gradle
      id: gradle-build
      env:
        GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
      run: |
        chmod +x gradlew
        # 把 Gradle 实际使用的签名配置与证书指纹打进日志，作为固定签名是否生效的判据
        ./gradlew :app:signingReport --no-daemon 2>&1 | grep -E "Variant: debug|Config: debug|Store:|Alias:|SHA-256:|Valid until" | head -20 || true
        ./gradlew clean assembleDebug --no-daemon 2>&1 | tee /tmp/gradle_output.txt
        GRADLE_EXIT=${PIPESTATUS[0]}
        echo "Gradle exit code: $GRADLE_EXIT"
        if [ $GRADLE_EXIT -ne 0 ]; then
          echo "GRADLE BUILD FAILED:"
          tail -80 /tmp/gradle_output.txt
          exit 1
        fi

    - name: Diagnose failure
      if: failure()
      run: |
        {
          echo "## Gradle 失败摘要"
          echo '```'
          grep -E "^[eE]rror|e: |FAILURE:|What went wrong|> Task.*FAILED|Caused by" /tmp/gradle_output.txt | head -50
          echo '```'
          echo "### 末尾 120 行"
          echo '```'
          tail -120 /tmp/gradle_output.txt
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"
        grep -E "^[eE]rror|e: |FAILURE:|What went wrong|Caused by" /tmp/gradle_output.txt | head -30 | while IFS= read -r line; do
          echo "::error::${line:0:300}"
        done

    - name: Check APK exists
      id: check-apk
      run: |
        echo "Checking for APK files..."
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk directory found"
        find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK files found"
        if ! find app/build/outputs -name "*.apk" | grep -q .; then
          echo "ERROR: No APK files produced by build!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: xvj-apk
        path: app/build/outputs/**/*.apk
