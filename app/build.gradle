plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xvj.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.xvj.app"
        minSdk 24
        targetSdk 34
        versionCode 167
        versionName "167"

        // MQTT 设备凭据（broker 鉴权改造）：密码绝不进公开仓库。
        // CI 由 GitHub Secret 注入环境变量 XVJ_MQTT_DEVICE_PW；本地构建可 -PXVJ_MQTT_DEVICE_PW=xxx 或同名环境变量；
        // 缺省空串 = 匿名连接（broker 未切换 allow_anonymous false 前的正常形态）
        def mqttPw = System.getenv("XVJ_MQTT_DEVICE_PW") ?: (project.findProperty("XVJ_MQTT_DEVICE_PW") ?: "")
        buildConfigField "String", "MQTT_DEVICE_PASSWORD", "\"${mqttPw}\""
    }

    signingConfigs {
        debug {
            // 固定签名：CI 从 secret 恢复的 keystore（本地缺文件时 validateSigningDebug 会按同名参数自动生成）
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true  // AGP8 默认关闭；MQTT_DEVICE_PASSWORD 等 BuildConfig 字段需要
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Media3 (ExoPlayer继任者)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
    
    // Lifecycle for Service
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    
    // MQTT for cloud connection
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
